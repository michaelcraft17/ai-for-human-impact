<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title{ font-family:Arial, 'Helvetica Neue', sans-serif; font-weight:800; }
      .sub{ font-family:Arial, 'Helvetica Neue', sans-serif; font-weight:600; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#F6F5F0"/>
  <rect width="1200" height="630" fill="none" stroke="#D9D6CB" stroke-width="2"/>

  <g opacity="0.85" transform="translate(760,60)">
    <circle cx="150" cy="130" r="120" fill="#B33F4E" style="mix-blend-mode:multiply"/>
    <circle cx="280" cy="115" r="120" fill="#2F6F8F" style="mix-blend-mode:multiply"/>
    <circle cx="165" cy="255" r="120" fill="#6B4E8E" style="mix-blend-mode:multiply"/>
    <circle cx="290" cy="255" r="120" fill="#3F7D4E" style="mix-blend-mode:multiply"/>
  </g>

  <text x="80" y="230" class="title" font-size="66" fill="#17191F">Build AI tools that</text>
  <text x="80" y="305" class="title" font-size="66" fill="#1F2A44">solve real problems.</text>

  <text x="80" y="380" class="sub" font-size="30" fill="#4B4E57">For people, by people.</text>

  <rect x="80" y="450" width="8" height="60" fill="#E2A73B"/>
  <text x="106" y="478" class="sub" font-size="26" fill="#17191F">AI for Human Impact — A BASIS Schools Hackathon</text>
  <text x="106" y="512" class="sub" font-size="24" fill="#4B4E57">Feb 6–12, 2027 · Fully online · Open to all BASIS high schools</text>
</svg>
