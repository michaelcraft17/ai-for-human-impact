<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title{ font-family:Arial, 'Helvetica Neue', sans-serif; font-weight:800; }
      .sub{ font-family:Arial, 'Helvetica Neue', sans-serif; font-weight:600; }
    </style>
    <linearGradient id="bgGlow1" cx="50%" cy="50%" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgGlow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="ogLight" cx="32%" cy="26%" r="65%">
      <stop offset="0%" stop-color="#BFE7FF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#BFE7FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#BFE7FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B1220"/>
  <circle cx="900" cy="120" r="420" fill="url(#bgGlow1)"/>
  <circle cx="1050" cy="500" r="360" fill="url(#bgGlow2)"/>

  <g fill="#FFFFFF">
    <circle cx="120" cy="90" r="1.6" opacity="0.6"/>
    <circle cx="260" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="60" cy="320" r="1.6" opacity="0.55"/>
    <circle cx="180" cy="470" r="1.2" opacity="0.4"/>
    <circle cx="340" cy="560" r="1.6" opacity="0.5"/>
    <circle cx="420" cy="80" r="1.2" opacity="0.45"/>
    <circle cx="500" cy="440" r="1.4" opacity="0.4"/>
    <circle cx="640" cy="560" r="1.2" opacity="0.4"/>
  </g>

  <rect x="80" y="454" width="7" height="60" fill="#F59E0B"/>
  <text x="106" y="480" class="sub" font-size="26" fill="#F1F5F9">AI for Human Impact</text>
  <text x="106" y="514" class="sub" font-size="24" fill="#9CA9C0">Feb 6–12, 2027 · Fully online · A BASIS Schools Hackathon</text>

  <text x="80" y="230" class="title" font-size="64" fill="#F1F5F9">Build AI tools that</text>
  <text x="80" y="302" class="title" font-size="64" fill="url(#textGrad)">solve real problems.</text>
  <text x="80" y="356" class="sub" font-size="30" fill="#9CA9C0">For people, by people.</text>

  <g transform="translate(870,60)">
    <circle cx="150" cy="150" r="146" fill="#0B1220" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="150" cy="150" r="141" fill="url(#ogLight)"/>
    <path d="M 28.12 154.22 A 121.88 121.88 0 1 1 85.31 253.59" fill="none" stroke="url(#markGrad)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="28.12" cy="154.22" r="13.5" fill="#22D3EE"/>
    <circle cx="85.31" cy="253.59" r="13.5" fill="#F59E0B"/>
    <text x="177.6" y="188.6" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="800" font-size="232" fill="#010203" opacity="0.8">B</text>
    <text x="153" y="162" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="800" font-size="232" fill="url(#markGrad)">B</text>
  </g>
